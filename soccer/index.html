<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4fb352" />
    <title>グリフサッカー 4v4 — Glyph Soccer</title>
    <meta name="description" content="文字が選手になる 4v4 アーケードサッカー。文字变成球员的 4v4 足球。Glyphs play 4v4 arcade football." />
    <!-- Open Graph / X card. %SITE_URL% is filled from VITE_SITE_URL at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glyph Rumble" />
    <meta property="og:title" content="グリフサッカー 4v4 — Glyph Soccer / 字形足球" />
    <meta property="og:description" content="文字が選手になる 4v4 サッカー。文字变成球员的 4v4 足球。Glyphs play 4v4 football." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="グリフサッカー 4v4 — Glyph Soccer" />
    <meta name="twitter:description" content="文字が選手になる 4v4 サッカー / 文字变成球员的 4v4 足球 / Glyphs play 4v4 football." />
    <meta name="twitter:image" content="%SITE_URL%og.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234fb352'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='900' fill='white'%3E字%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>

      <header class="topbar">
        <h1 class="logo"><span class="logo-mark">⚽</span><span data-i18n="title"></span></h1>
        <div class="tools">
          <select id="lang" aria-label="Language"></select>
          <button id="btn-quality" class="chip" type="button"></button>
          <button id="btn-sound" class="chip" type="button"></button>
        </div>
      </header>

      <section id="screen-select" class="screen">
        <p class="tagline" data-i18n="tagline"></p>
        <div class="select-bottom">
          <div class="teams">
            <div class="team" data-team="0"></div>
            <div class="vs-col"><div class="vs">VS</div></div>
            <div class="team" data-team="1"></div>
          </div>
          <div class="examples" id="examples"></div>
          <div class="actions">
            <button id="btn-random-match" class="btn secondary" type="button" data-i18n="randomMatch"></button>
            <button id="btn-kickoff" class="btn primary big" type="button" data-i18n="kickoff"></button>
          </div>
        </div>
      </section>

      <section id="screen-match" class="screen hidden">
        <div class="scoreboard">
          <div class="sb-team" data-team="0"><span class="sb-name"></span></div>
          <div class="sb-mid"><span class="sb-score" id="sb-score">0 - 0</span><span class="sb-clock" id="sb-clock">0:00</span></div>
          <div class="sb-team right" data-team="1"><span class="sb-name"></span></div>
        </div>
        <div class="hud-buttons">
          <button id="btn-speed" class="round" type="button" aria-label="speed">×1</button>
          <button id="btn-pause" class="round" type="button" aria-label="pause">❚❚</button>
        </div>
        <div class="banner" id="banner"></div>
        <div class="commentary" id="commentary" aria-live="polite"></div>
        <div class="pause-overlay hidden" id="pause-overlay">
          <div class="pause-box">
            <button id="btn-resume" class="btn primary" type="button" data-i18n="resume"></button>
            <button id="btn-restart" class="btn secondary" type="button" data-i18n="restart"></button>
            <button id="btn-pause-change" class="btn ghost" type="button" data-i18n="change"></button>
          </div>
        </div>
      </section>

      <section id="screen-result" class="screen hidden">
        <div class="result-card">
          <div class="res-score" id="res-score"></div>
          <div class="res-winner" id="res-winner"></div>
          <div class="res-mvp" id="res-mvp"></div>
          <ul class="report" id="report"></ul>
          <div class="result-actions">
            <button id="btn-again" class="btn primary" type="button" data-i18n="again"></button>
            <button id="btn-change" class="btn secondary" type="button" data-i18n="change"></button>
            <button id="btn-random2" class="btn secondary" type="button" data-i18n="randomMatch"></button>
            <button id="btn-save" class="btn ghost" type="button" data-i18n="save"></button>
            <button id="btn-share" class="btn ghost" type="button" data-i18n="share"></button>
          </div>
        </div>
      </section>

      <div id="bubbles" aria-hidden="true"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <footer class="credits" data-i18n="footer"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a5e8e7df5e104d7983f54ebbc6cf8438"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
