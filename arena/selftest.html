<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph Rumble 3D — Self test</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; background: #faf8ff; color: #2b1a4a; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      table { border-collapse: collapse; margin: 8px 0 16px; }
      th, td { border: 1px solid #ddd3f3; padding: 3px 7px; text-align: right; }
      th { background: #efeaff; }
      td.l { text-align: left; font-weight: 700; font-size: 16px; }
      .bad { background: #ffd6d6; }
      #view { width: 100%; max-width: 1100px; height: 520px; display: block; border-radius: 12px; background: #c7e6ff; }
      pre { background: #fff; padding: 8px; border: 1px solid #ddd3f3; max-height: 240px; overflow: auto; }
      #status { font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Glyph Rumble 3D — self test</h1>
    <p id="status">running…</p>
    <canvas id="view"></canvas>
    <h2>Generated fighters</h2>
    <div id="fighters"></div>
    <h2>Round-robin battles (headless, real glyph stats)</h2>
    <div id="battles"></div>
    <h2>Render performance</h2>
    <div id="perf"></div>
    <pre id="json"></pre>
    <script type="module" src="/src/selftest.ts"></script>
  </body>
</html>
