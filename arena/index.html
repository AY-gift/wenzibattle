<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc8ff" />
    <title>字形乱闘 3D — Glyph Rumble 3D</title>
    <meta name="description" content="文字・絵文字・顔文字が3Dのおもちゃになって自動で戦うブラウザゲーム。" />
    <!-- Open Graph / X card (site-wide). %SITE_URL% is filled from VITE_SITE_URL at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glyph Rumble 3D" />
    <meta property="og:title" content="字形乱闘 3D — Glyph Rumble 3D" />
    <meta property="og:description" content="文字・絵文字・顔文字が3Dのおもちゃになって自動で戦う。输入任何文字，变成 3D 玩具自动对战。Type anything and watch it fight as a 3D toy." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="字形乱闘 3D — 火 VS 水" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="字形乱闘 3D — Glyph Rumble 3D" />
    <meta name="twitter:description" content="文字が3Dのおもちゃになって戦うブラウザゲーム / 文字变 3D 玩具自动对战 / Type anything, watch it fight." />
    <meta name="twitter:image" content="%SITE_URL%og.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff4f8b'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='900' fill='white'%3E字%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>

      <header class="topbar">
        <h1 class="logo"><span class="logo-mark">字</span><span data-i18n="title"></span></h1>
        <div class="tools">
          <select id="lang" aria-label="Language"></select>
          <button id="btn-quality" class="chip" type="button"></button>
          <button id="btn-sound" class="chip" type="button"></button>
        </div>
      </header>

      <section id="screen-select" class="screen">
        <p class="tagline" data-i18n="tagline"></p>
        <div class="select-bottom">
          <div class="cards">
            <div class="card" data-slot="0">
              <div class="card-head">
                <span class="slot-label" data-i18n="fighterA"></span>
                <button class="dice" type="button" aria-label="random">🎲</button>
              </div>
              <input class="glyph-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" />
              <div class="desc"></div>
              <div class="stats"></div>
              <div class="warn"></div>
            </div>
            <div class="vs-col"><div class="vs">VS</div></div>
            <div class="card" data-slot="1">
              <div class="card-head">
                <span class="slot-label" data-i18n="fighterB"></span>
                <button class="dice" type="button" aria-label="random">🎲</button>
              </div>
              <input class="glyph-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" />
              <div class="desc"></div>
              <div class="stats"></div>
              <div class="warn"></div>
            </div>
          </div>
          <div class="examples" id="examples"></div>
          <div class="format" id="format" role="radiogroup">
            <span class="fmt-label" data-i18n="fmtLabel"></span>
            <button type="button" role="radio" data-bo="1" data-i18n="fmt1"></button>
            <button type="button" role="radio" data-bo="3" data-i18n="fmt3"></button>
          </div>
          <div class="actions">
            <button id="btn-random-match" class="btn secondary" type="button" data-i18n="randomMatch"></button>
            <button id="btn-fight" class="btn primary big" type="button" data-i18n="fight"></button>
          </div>
        </div>
      </section>

      <section id="screen-battle" class="screen hidden">
        <div class="hud">
          <div class="hp-side" data-slot="0">
            <div class="hp-name"></div>
            <div class="hpbar"><i></i><b></b></div>
          </div>
          <div class="timer" id="timer">15</div>
          <div class="hp-side right" data-slot="1">
            <div class="hp-name"></div>
            <div class="hpbar"><i></i><b></b></div>
          </div>
        </div>
        <div class="series-hud hidden" id="series-hud" aria-live="polite"></div>
        <div class="hud-buttons">
          <button id="btn-pause" class="round" type="button" aria-label="pause">❚❚</button>
          <button id="btn-rematch-live" class="round" type="button" aria-label="rematch">↻</button>
        </div>
        <div class="banner" id="banner"></div>
        <div class="commentary" id="commentary" aria-live="polite"></div>
        <div class="cam-hint" data-i18n="camHint"></div>
        <div class="pause-overlay hidden" id="pause-overlay">
          <div class="pause-box">
            <button id="btn-resume" class="btn primary" type="button" data-i18n="resume"></button>
            <button id="btn-pause-restart" class="btn secondary" type="button" data-i18n="restart"></button>
            <button id="btn-pause-change" class="btn ghost" type="button" data-i18n="change"></button>
          </div>
        </div>
      </section>

      <section id="screen-result" class="screen hidden">
        <div class="result-card">
          <div class="winner-label">WINNER</div>
          <div class="winner-name" id="winner-name"></div>
          <div class="reason" id="reason"></div>
          <div class="series-score hidden" id="series-score"></div>
          <ul class="report" id="report"></ul>
          <div class="mini-stats" id="mini-stats"></div>
          <div class="result-actions">
            <button id="btn-again" class="btn primary" type="button" data-i18n="again"></button>
            <button id="btn-change" class="btn secondary" type="button" data-i18n="change"></button>
            <button id="btn-random2" class="btn secondary" type="button" data-i18n="randomMatch"></button>
            <button id="btn-save" class="btn ghost" type="button" data-i18n="save"></button>
            <button id="btn-share" class="btn ghost" type="button" data-i18n="share"></button>
          </div>
          <div class="seed" id="seed"></div>
        </div>
      </section>

      <div id="bubbles" aria-hidden="true"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <footer class="credits" data-i18n="footer"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a5e8e7df5e104d7983f54ebbc6cf8438"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
